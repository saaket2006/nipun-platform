
name: Nipun Tailwind CSS Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailwind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tailwind CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Verify generated CSS
        run: test -s frontend/assets/css/tailwind.min.css
